# Nome da aplicacao
spring.application.name=gerenciadorcompromissos

# Configuracoes do JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracoes da fonte de dados (DataSource)
spring.datasource.url=jdbc:mysql://db:3306/gerenciador_compromissos?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracoes do Flyway (migrations)
spring.flyway.enabled=true
#spring.flyway.url=jdbc:mysql://db:3306/gerenciador_compromissos?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
#spring.flyway.user=root
#spring.flyway.password=root
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
#spring.flyway.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.flyway.database-type=mysql

# Configuracoes do SpringDoc / Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html